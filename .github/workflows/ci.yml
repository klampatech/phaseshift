name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build + Headless + Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Verify bundle size (main entry < 200 KB gzipped)
        run: |
          set -euo pipefail
          MAIN_GZ=$(stat -c%s dist/assets/index-*.js.gz 2>/dev/null || stat -c%s dist/assets/index-*.js)
          GZ_SIZE=$(gzip -c dist/assets/index-*.js | wc -c)
          echo "Main entry gzipped: $GZ_SIZE bytes"
          if [ "$GZ_SIZE" -gt 204800 ]; then
            echo "::error::Main entry bundle exceeds 200 KB gzipped ($GZ_SIZE bytes)"
            exit 1
          fi

      - name: Run headless unit tests
        run: |
          for f in tests/headless/test-phase*.cjs; do
            echo "=== $f ==="
            node "$f"
          done

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
